cargo-features = ["panic-immediate-abort"]

[package]
name = "sion-player"
version = "0.4.0"
authors = ["popcar2"]
edition = "2021"
license = "MIT"

[dependencies]
sion = { path = "../sion", features = ["small"] }
tinyaudio = "1"

[build-dependencies]
# build.rs measures each song's loudness to set its volume.
sion = { path = "../sion" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = true

[profile.release.build-override]
opt-level = 3 # build.rs renders every song: fast, not small
