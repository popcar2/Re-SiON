<!doctype html>
<!-- MML playground: write or paste MML and play it, with the notes being played highlighted in the text.
     Uses the same files as songs.html (style.css, js/, wasm/sion.wasm, songs/). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiON Playground</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 960px; padding-bottom: 0; }
  header { margin-bottom: 16px; }

  .tools { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .tools button {
    height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px;
  }
  .tools button:hover { background: var(--hover); }
  .tools button.go { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tools button.go:hover { opacity: 0.85; }
  .tools svg { width: 10px; height: 10px; }
  .tools kbd { color: var(--muted); font: 11px ui-monospace, monospace; }
  .tools .go kbd { color: inherit; opacity: 0.6; }

  .examples { position: relative; }
  .menu {
    position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; width: min(420px, calc(100vw - 32px));
    max-height: 60vh; overflow: auto; padding: 4px; margin: 0; list-style: none;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.12);
  }
  .menu[hidden] { display: none; }
  .menu button {
    width: 100%; height: auto; display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; border: 0; border-radius: 6px;
    text-align: left; white-space: nowrap;
  }
  .menu button span:first-child { overflow: hidden; text-overflow: ellipsis; }
  /* On narrow screens the menu would stick out past the right edge under the Examples button (widening the page,
     which shifted the player bar out of view), so there it spans the toolbar instead. */
  @media (max-width: 560px) {
    .tools { position: relative; }
    .examples { position: static; }
    .menu { width: 100%; }
  }
  .menu button .a { margin-left: auto; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }

  /* The editor: a textarea with transparent text over a <pre> showing the same text, so the notes being
     played can be highlighted in it. Both wrap the same way (same width, with room for a scrollbar kept in both) and scroll together,
     so their text lines up. */
  .editor {
    position: relative; height: calc(100vh - 230px); min-height: 240px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg);
  }
  .editor:focus-within { border-color: var(--muted); }
  .editor pre, .editor textarea {
    position: absolute; inset: 0; margin: 0; padding: 12px 14px 12px 22px; border: 0; width: 100%; height: 100%;
    font: 13px/1.55 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; tab-size: 4;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; letter-spacing: 0;
    scrollbar-gutter: stable;
  }
  /* Extra room at the end, so the <pre> can always scroll as far as the textarea. */
  .editor pre { overflow: hidden; color: var(--fg); padding-bottom: 40px; pointer-events: none; }
  /* Marks in the left margin on rows that continue a wrapped line. */
  .editor .wraps { position: absolute; left: 0; top: 0; }
  .editor .wraps span { position: absolute; left: 6px; color: var(--muted); }
  .editor textarea {
    color: transparent; caret-color: var(--fg); background: transparent; resize: none; outline: none; overflow: auto;
  }
  /* The selection is drawn over the <pre>'s text, so it has to be see-through. */
  .editor textarea::selection { color: transparent; background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .editor textarea::placeholder { color: var(--muted); }
  ::highlight(playing) {
    color: var(--accent); background-color: color-mix(in srgb, var(--accent) 16%, transparent);
    text-shadow: 0.35px 0 0 var(--accent), -0.35px 0 0 var(--accent);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="./">SiON</a></h1>
    <nav><a href="songs">Songs</a><a href="playground" aria-current="page">Playground</a><a href="convert">Convert</a><a href="docs">Docs</a></nav>
  </header>
  <div class="tools">
    <button class="go" id="run" title="Play from the start (Ctrl+Enter)">
      <svg viewBox="0 0 16 16"><path d="M4 2.5v11L13.5 8z" fill="currentColor"/></svg>Play <kbd>Ctrl+↵</kbd>
    </button>
    <div class="examples">
      <button id="examples" aria-haspopup="menu" aria-expanded="false">Examples
        <svg viewBox="0 0 16 16"><path d="M3 6l5 5 5-5z" fill="currentColor"/></svg></button>
      <ul class="menu" id="menu" role="menu" hidden></ul>
    </div>
  </div>
  <div class="editor">
    <pre id="view" aria-hidden="true"></pre>
    <textarea id="mml" spellcheck="false" autocomplete="off" autocapitalize="off"
      aria-label="MML" placeholder="Write or paste MML here, then press play."></textarea>
  </div>
</main>

<script type="module">
import { createPlayer } from "./js/player.js";
const $ = (id) => document.getElementById(id);
const text = $("mml"), view = $("view");

// Songs from songs/ to read along with, mostly short and simple.
const EXAMPLES = [
  "fukuicat - ZANAC(FDS) _ AREA1,3,6,9.mml",
  "keim_at_Si - Formant Singing _.mml",
  "keim_at_Si - In the wind (GRADIUSIII).mml",
  "yonatan - Tomaso Albinoni _ Adagio in G minor.mml",
  "LinearDrive - [FC] BALLOON FIGHT - BALLOON TRIP - (C)Nintendo 1984.mml",
  "keim_at_Si - Twin Memories _ Pop'nツインビー (Stage1).mml",
].map((file) => {
  const name = file.replace(/\.(sion)?mml$/i, ""), cut = name.indexOf(" - ");
  return { file, title: name.slice(cut + 3), artist: name.slice(0, cut), volume: 1 };
});
// The song list's per-song volumes (see songs.html), so examples play as loud as they do there.
fetch("songs/songs.json", { cache: "no-cache" }).then((r) => r.json()).then((list) => {
  for (const e of EXAMPLES) e.volume = list.find((s) => s.file === e.file)?.volume ?? 1;
}).catch(() => {});

const STARTER = `// Paste some MML here to play it!
// Writing it manually is very difficult, but programs like Bosca Ceoil Blue can export SiON-compatible MML.
// Select an example above to see how SiON plays in real time, or try editing this basic example.

// Original SiON reference manual: https://keim.github.io/SiON/mmlref/sion_mml_reference_e.html

// Do Re Mi Fa Sol La Si Do on a pure sine wave (%5@0). $ marks where it loops from.

t100;           // tempo: 100 beats per minute
%5@0,40,0,0,40  // attack and release speeds (0-63): each note fades in and out quickly to avoid popping
v10             // volume: 10 out of 16, so it's not too loud
l4              // note length: quarter notes, unless a note gives its own (r2 is a half-note rest)
$ o5 c d e f g a b <c r2 c> b a g f e d c r2;  // o5: starts at the 5th octave
`;

// ---- Editor ----
// Every visit, reloads included, starts from STARTER.
// What's in the textarea came from this example (its title and volume carry over until the text is replaced).
let source = null;
text.value = STARTER;

function render() {
  view.textContent = text.value + "\n "; // (a trailing newline only shows in the textarea with something after it)
  view.append(wraps);
  sync();
  markWraps();
}

// Mark each row that continues a wrapped line, in the left margin. A line's text wraps over as many rows as its
// range has boxes (counted by changes in top). Redone after the layout settles, whenever the text or width changes.
// Only lines that might be too long for a row are measured: a line of n characters without tabs takes at most 2n
// columns (wide characters take two), so one of up to cols / 2 can't wrap.
const wraps = document.createElement("div");
wraps.className = "wraps";
let wrapFrame = 0, cols = 0;
function measure() {
  const style = getComputedStyle(view), probe = document.createElement("canvas").getContext("2d");
  probe.font = style.font;
  cols = (view.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)) / probe.measureText("0").width;
  markWraps();
}
function markWraps() {
  cancelAnimationFrame(wrapFrame);
  wrapFrame = requestAnimationFrame(() => {
    const node = view.firstChild, str = text.value, top = view.getBoundingClientRect().top - view.scrollTop;
    const range = new Range(), marks = [];
    for (let a = 0, tab = str.indexOf("\t"); a < str.length;) {
      let b = str.indexOf("\n", a);
      if (b < 0) b = str.length;
      if (tab >= 0 && tab < a) tab = str.indexOf("\t", a);
      if (b - a > cols / 2 || (tab >= 0 && tab < b)) {
        range.setStart(node, a);
        range.setEnd(node, b);
        let row;
        for (const r of range.getClientRects()) {
          const y = Math.round(r.top);
          if (row !== undefined && y !== row) marks.push(`<span style="top:${y - top}px">↵</span>`);
          row = y;
        }
      }
      a = b + 1;
    }
    wraps.innerHTML = marks.join("");
  });
}
new ResizeObserver(measure).observe(text);
document.fonts?.ready.then(measure);
function sync() { view.scrollTop = text.scrollTop }
text.addEventListener("input", () => {
  if (!text.value) source = null;
  render();
  hl?.clear(); // the playing song's offsets no longer match the text
});
text.addEventListener("scroll", sync);
// Tab indents rather than leaving the editor.
text.addEventListener("keydown", (e) => {
  if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); document.execCommand("insertText", false, "\t") }
});
render();

// ---- Highlighting the notes being played ----
// The player reports UTF-8 byte offsets of the notes playing; `index` turns them into string (UTF-16) indices.
const hl = globalThis.Highlight && CSS.highlights ? new Highlight() : null;
if (hl) CSS.highlights.set("playing", hl);
let played = null, index = null; // the text being played, and its byte → string index map
// (Whitespace only counts inside the note, before its length or dots: never the space after it.)
const NOTE = /[a-g][+#-]?(?:\s*\d+)?(?:\s*\.+)?/y;

function byteIndex(s) {
  const map = new Int32Array(new TextEncoder().encode(s).length + 1);
  let b = 0;
  for (let j = 0; j < s.length; j++) {
    const c = s.codePointAt(j), n = c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
    map.fill(j, b, b + n);
    b += n;
    if (c >= 0x10000) j++;
  }
  map[b] = s.length;
  return map;
}

function notes(offsets) {
  if (!hl) return;
  hl.clear();
  if (!offsets.length || text.value !== played || !view.firstChild) return;
  const node = view.firstChild;
  for (const o of new Set(offsets)) {
    const at = index[o];
    if (at === undefined) continue;
    NOTE.lastIndex = at;
    if (!NOTE.exec(played)) continue;
    const r = new Range();
    r.setStart(node, at);
    r.setEnd(node, NOTE.lastIndex);
    hl.add(r);
  }
}

// ---- Player ----
const player = createPlayer({ idleText: "Playground", heatmap: true, idle: run, notes });

function run() {
  played = text.value;
  index = byteIndex(played);
  // An example's artist, volume and file name stay with the text only while it keeps that example's #TITLE.
  const title = titleOf(played);
  if (source && title !== source.mmlTitle) source = null;
  const s = source ?? { title: "Untitled", artist: "Playground" };
  player.play(played, { title: title ?? s.title, artist: s.artist, volume: s.volume ?? 1, file: s.file });
}

// The song's #TITLE{..}, if it has one (outside comments).
function titleOf(mml) {
  const m = mml.replace(/\/\*[\s\S]*?(\*\/|$)|\/\/.*/g, "").match(/#TITLE\s*\{([^}]*)\}/);
  return m?.[1].trim() || null;
}
$("run").onclick = run;
addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run() }
});

// ---- Examples ----
const menu = $("menu"), open = (on) => { menu.hidden = !on; $("examples").setAttribute("aria-expanded", on) };
for (const e of EXAMPLES) {
  const li = document.createElement("li"), b = document.createElement("button");
  b.setAttribute("role", "menuitem");
  b.innerHTML = `<span></span><span class="a"></span>`;
  b.firstChild.textContent = e.title;
  b.lastChild.textContent = e.artist;
  b.onclick = () => pick(e);
  li.append(b);
  menu.append(li);
}
$("examples").onclick = (ev) => { ev.stopPropagation(); open(menu.hidden); if (!menu.hidden) menu.querySelector("button").focus() };
document.addEventListener("click", (ev) => { if (!menu.contains(ev.target)) open(false) });
menu.addEventListener("keydown", (ev) => {
  const items = [...menu.querySelectorAll("button")], k = items.indexOf(document.activeElement);
  if (ev.key === "Escape") { ev.stopPropagation(); open(false); $("examples").focus() }
  else if (ev.key === "ArrowDown") { ev.preventDefault(); items[(k + 1) % items.length].focus() }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); items[(k - 1 + items.length) % items.length].focus() }
});

async function pick(e) {
  open(false);
  const mml = await (await fetch("songs/" + encodeURIComponent(e.file), { cache: "no-cache" })).text();
  // Through insertText, so picking an example can be undone (Ctrl+Z) like any edit. Not on touch screens:
  // focusing the editor there pops up the on-screen keyboard, and its opening and closing again shifts the
  // page, which pushed the player bar out of view.
  if (matchMedia("(pointer: coarse)").matches) text.value = mml;
  else {
    text.focus({ preventScroll: true });
    text.select();
    if (!document.execCommand("insertText", false, mml)) text.value = mml;
  }
  source = { ...e, mmlTitle: titleOf(mml) };
  text.setSelectionRange(0, 0);
  text.scrollTop = 0;
  text.blur();
  render();
  run();
}
</script>
</body>
</html>
