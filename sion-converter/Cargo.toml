[package]
name = "sion-converter"
version = "0.4.0"
authors = ["popcar2"]
edition = "2021"
license = "MIT"
description = "Convert MIDI, tracker modules (MOD/S3M/XM/IT), VGM/VGZ, GYM and S98 chip music, NSF/NSFE/NSF2, GBS and SPC to SiON MML"

[[bin]]
name = "sion-convert"
path = "src/main.rs"

[dependencies]
# Inflate for gzipped VGM files (.vgz).
miniz_oxide = "0.8"
# Renders the output: to keep it from clipping, and for `--verify` (minifying must not change the audio) and `--wav`.
sion = { path = "../sion" }

[profile.release]
lto = true
codegen-units = 1
# A panic only ends the program (its message still prints): no unwinding tables, and no symbols.
panic = "abort"
strip = true

# The wasm build (`build-wasm.sh`): "s" converts as fast as 3 (2026-11-17, 29 SPCs in node: 52.5 s either way) and
# is 17% smaller gzipped (334 vs 401 KB); "z" is smaller still (293 KB) but 37% slower. A panic aborts (the JS
# wrapper then starts a fresh instance).
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = "debuginfo"
