[package]
name = "sion-converter"
version = "0.2.0"
authors = ["popcar2"]
edition = "2021"
description = "Convert MIDI, tracker modules (MOD/S3M/XM/IT), VGM/VGZ, GYM and S98 chip music, NSF/NSFE and SPC to SiON MML"

[[bin]]
name = "sion-convert"
path = "src/main.rs"

[dependencies]
# Inflate for gzipped VGM files (.vgz).
miniz_oxide = "0.8"
# Renders the output: to keep it from clipping, and for `--verify` (minifying must not change the audio) and `--wav`.
sion = { path = "../sion" }

[profile.release]
lto = true
codegen-units = 1

# The wasm build (`build-wasm.sh`): converting is heavy work (chip emulation, rendering to check the volume,
# minifying), so optimise for speed; a panic aborts (the JS wrapper then starts a fresh instance).
[profile.wasm]
inherits = "release"
opt-level = 3
panic = "abort"
strip = "debuginfo"
