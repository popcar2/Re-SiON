cargo-features = ["panic-immediate-abort"]

[package]
name = "sion-wasm"
version = "0.2.0"
authors = ["popcar2"]
edition = "2021"
description = "WebAssembly build (sion.wasm) of the SiON MML player"

[lib]
name = "sion"
crate-type = ["cdylib"]

[dependencies]
sion_core = { package = "sion", path = "../sion", features = ["spans"] }

[profile.release]
# Smallest size. (The `small` speed-optimised hot paths add ~6 KB and gain nothing measurable under a wasm JIT.)
opt-level = "z"
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = "debuginfo" # keep the target_features section: wasm-opt reads it to know which features to allow
